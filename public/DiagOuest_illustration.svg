<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="900 150 960 700" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF1FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#164480" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DCE8F6"/><stop offset="1" stop-color="#DCE8F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#164480" flood-opacity="0.14"/>
    </filter>
    <symbol id="spark" viewBox="-10 -10 20 20"><path d="M0-10C1 -2 2 -1 10 0C2 1 1 2 0 10C-1 2 -2 1 -10 0C-2 -1 -1 -2 0 -10Z" fill="#F2B933"/></symbol>
  </defs>

  <rect width="1920" height="1400" fill="url(#bg)"/>
  <rect width="1920" height="1400" fill="url(#grid)"/>
  <!-- bande décorative -->
  <path d="M0 860 C 500 800, 1100 900, 1920 820 V900 H0Z" fill="#164480" opacity="0.06"/>

  <!-- ===== TEXTE ===== -->
  <g id="texte" display="none">
    <rect x="140" y="214" width="476" height="50" rx="25" fill="#5B965A" fill-opacity="0.12"/>
    <path d="M172 226 l14 5 v9 c0 9-6 14-14 17 c-8-3-14-8-14-17 v-9z" fill="#5B965A"/>
    <path d="M166 240 l5 5 l9-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="198" y="246" font-size="17" font-weight="700" fill="#5B965A" letter-spacing="2">DIAGNOSTICS IMMOBILIERS CERTIFIÉS</text>

    <text x="134" y="400" font-size="140" font-weight="800" letter-spacing="-4"><tspan fill="#164480">Diag</tspan><tspan fill="#5B965A">Ouest</tspan></text>
    <path d="M452 436 C 560 452, 700 450, 815 428" fill="none" stroke="#F2B933" stroke-width="9" stroke-linecap="round"/>

    <text x="140" y="500" font-size="40" font-weight="700" fill="#164480">Vendre, louer, rénover :</text>
    <text x="140" y="550" font-size="40" font-weight="700" fill="#164480">diagnostiquez en toute sécurité.</text>

    <text x="140" y="612" font-size="22" font-weight="400" fill="#164480" fill-opacity="0.72">Une équipe jeune et certifiée, des outils de nouvelle génération</text>
    <text x="140" y="644" font-size="22" font-weight="400" fill="#164480" fill-opacity="0.72">pour des diagnostics fiables, clairs et rapides.</text>

    <rect x="140" y="690" width="300" height="66" rx="33" fill="#164480" filter="url(#sh)"/>
    <text x="290" y="731" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Demander un devis</text>
    <rect x="464" y="692" width="262" height="62" rx="31" fill="#fff" stroke="#5B965A" stroke-width="2.5"/>
    <text x="595" y="731" font-size="22" font-weight="700" fill="#5B965A" text-anchor="middle">Nos diagnostics</text>

    <g font-size="19" font-weight="600" fill="#164480">
      <circle cx="152" cy="808" r="12" fill="#5B965A"/><path d="M146 808 l4 4 l8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="174" y="815">Certifié</text>
      <circle cx="282" cy="808" r="12" fill="#5B965A"/><path d="M276 808 l4 4 l8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="304" y="815">Assuré</text>
      <circle cx="402" cy="808" r="12" fill="#5B965A"/><path d="M396 808 l4 4 l8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="424" y="815">Indépendant</text>
    </g>
  </g>

  <!-- ===== ILLUSTRATION ===== -->
  <g id="illu">
    <circle cx="1360" cy="470" r="440" fill="url(#glow)"/>
    <circle cx="1360" cy="470" r="330" fill="#E3EDF8"/>
    <circle cx="1360" cy="470" r="385" fill="none" stroke="#164480" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="4 12"/>
    <!-- repères boussole -->
    <g fill="#164480" fill-opacity="0.35" font-size="20" font-weight="700" text-anchor="middle">
      <text x="1360" y="74">N</text><text x="1360" y="882">S</text><text x="964" y="477">O</text><text x="1758" y="477">E</text>
    </g>

    <!-- maison -->
    <path d="M1420 318 V272 H1462 V353" fill="#fff" stroke="#164480" stroke-width="20" stroke-linejoin="round"/>
    <path d="M1170 405 V685 H1480 V405" fill="#fff" stroke="#164480" stroke-width="22" stroke-linejoin="round"/>
    <path d="M1112 425 L1325 245 L1538 425" fill="none" stroke="#164480" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1212" y="450" width="84" height="74" rx="8" fill="#F4F8FD" stroke="#164480" stroke-width="12"/>
    <path d="M1254 450 V524 M1212 487 H1296" stroke="#164480" stroke-width="8"/>
    <rect x="1206" y="565" width="72" height="120" rx="8" fill="#F4F8FD" stroke="#164480" stroke-width="12"/>
    <circle cx="1262" cy="628" r="5" fill="#164480"/>
    <path d="M1090 685 H1250" stroke="#164480" stroke-width="12" stroke-linecap="round"/>

    <!-- loupe -->
    <path d="M1515 655 L1612 752" stroke="#164480" stroke-width="38" stroke-linecap="round"/>
    <path d="M1515 655 L1545 685" stroke="#0F3462" stroke-width="40" stroke-linecap="butt"/>
    <circle cx="1420" cy="560" r="134" fill="#fff" stroke="#164480" stroke-width="24" filter="url(#sh)"/>
    <path d="M1335 490 A110 110 0 0 1 1395 452" fill="none" stroke="#164480" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round"/>

    <!-- jauge -->
    <path d="M1332 600 A88 88 0 0 1 1414 512" fill="none" stroke="#5B965A" stroke-width="22" stroke-linecap="round"/>
    <path d="M1426 512 A88 88 0 0 1 1508 600" fill="none" stroke="#F2B933" stroke-width="22" stroke-linecap="round"/>
    <g stroke="#164480" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <path d="M1356 600 h10"/><path d="M1474 600 h10"/><path d="M1420 536 v10"/>
      <path d="M1375 555 l7 7"/><path d="M1465 555 l-7 7"/>
    </g>
    <!-- aiguille boussole -->
    <g transform="rotate(-38 1420 600)">
      <path d="M1420 516 L1433 600 L1420 610 L1407 600Z" fill="#F2B933"/>
      <path d="M1420 516 L1420 610 L1407 600Z" fill="#D9A01F"/>
      <path d="M1420 610 L1430 604 L1420 650 L1410 604Z" fill="#164480" fill-opacity="0.25"/>
    </g>
    <circle cx="1420" cy="600" r="11" fill="#164480"/><circle cx="1420" cy="600" r="4" fill="#fff"/>
    <text x="1420" y="650" font-size="18" font-weight="800" fill="#164480" text-anchor="middle" letter-spacing="3">DIAG</text>

    <!-- cartes flottantes -->
    <g filter="url(#sh)">
      <rect x="930" y="262" width="270" height="80" rx="18" fill="#fff"/>
      <rect x="1560" y="214" width="262" height="80" rx="18" fill="#fff"/>
      <rect x="960" y="728" width="304" height="80" rx="18" fill="#fff"/>
    </g>
    <!-- carte 1 : certifié -->
    <circle cx="975" cy="302" r="24" fill="#5B965A" fill-opacity="0.14"/>
    <path d="M975 288 l12 4 v8 c0 8-5 12-12 15 c-7-3-12-7-12-15 v-8z" fill="#5B965A"/>
    <path d="M970 301 l4 4 l7-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1012" y="296" font-size="18" font-weight="700" fill="#164480">Diagnostiqueur</text>
    <text x="1012" y="320" font-size="16" font-weight="500" fill="#5B965A">certifié</text>
    <!-- carte 2 : DPE -->
    <circle cx="1605" cy="254" r="24" fill="#F2B933" fill-opacity="0.18"/>
    <path d="M1608 238 l-12 19 h9 l-3 14 l12-19 h-9z" fill="#F2B933"/>
    <text x="1642" y="248" font-size="18" font-weight="700" fill="#164480">DPE nouvelle</text>
    <text x="1642" y="272" font-size="16" font-weight="500" fill="#164480" fill-opacity="0.6">génération</text>
    <g><rect x="1770" y="238" width="10" height="34" rx="3" fill="#5B965A"/><rect x="1784" y="246" width="10" height="26" rx="3" fill="#5B965A" fill-opacity="0.6"/><rect x="1798" y="256" width="10" height="16" rx="3" fill="#F2B933"/></g>
    <!-- carte 3 : sécurité -->
    <circle cx="1005" cy="768" r="24" fill="#164480" fill-opacity="0.1"/>
    <rect x="995" y="766" width="20" height="16" rx="3" fill="#164480"/>
    <path d="M999 766 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#164480" stroke-width="3"/>
    <text x="1042" y="762" font-size="18" font-weight="700" fill="#164480">Contrôles sécurisés</text>
    <text x="1042" y="786" font-size="16" font-weight="500" fill="#164480" fill-opacity="0.6">Amiante · Gaz · Électricité</text>

    <!-- étincelles nouveauté -->
    <use href="#spark" x="1535" y="330" width="30" height="30"/>
    <use href="#spark" x="1578" y="380" width="16" height="16"/>
    <use href="#spark" x="1080" y="185" width="20" height="20"/>
    <use href="#spark" x="1680" y="640" width="22" height="22"/>
  </g>
</svg>
